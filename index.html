<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta id="theme-color" name="theme-color" content="#f4f1e9" />
    <meta name="description" content="Choose a piano piece, listen, and learn how its musical layers work." />
    <title>Piano Book — Learn pieces from the inside out</title>
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem('pianobook-theme')
          const theme = savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          document.querySelector('#theme-color').content = theme === 'dark' ? '#171a18' : '#f4f1e9'
        } catch {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.style.colorScheme = 'light'
          document.querySelector('#theme-color').content = '#f4f1e9'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
